<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head}"></head>
<body>
<h3>Edit Product</h3>
<p><a th:href="@{/products}">Back to product list</a></p>

<form th:action="@{/products/update}" th:object="${product}" method="POST">
    <input type="hidden" th:field="*{id}"/>
    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required/>
    </div>
    <div class="form-group">
        <label for="price">Price ($):</label>
        <input type="number" id="price" th:field="*{price}" step="0.01" min="0" required/>
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" th:field="*{description}"></textarea>
    </div>
    <div class="form-group">
        <label for="manufacturer">Manufacturer:</label>
        <input type="text" id="manufacturer" th:field="*{manufacturer}" required/>
    </div>
    <div style="margin-top: 15px;">
        <input type="submit" value="Update" class="btn"/>
    </div>
</form>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
