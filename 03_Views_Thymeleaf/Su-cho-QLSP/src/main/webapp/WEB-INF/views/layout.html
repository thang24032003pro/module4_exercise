<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title>Product Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .notify { color: green; font-weight: bold; margin-bottom: 10px; }
        a { text-decoration: none; color: #0275d8; }
        a:hover { text-decoration: underline; }
        .btn { display: inline-block; padding: 6px 14px; background: #4CAF50; color: white; border-radius: 4px; border: none; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #45a049; text-decoration: none; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .search-box { margin: 15px 0; display: flex; gap: 8px; align-items: center; }
        .search-box input[type="text"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; width: 250px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 320px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }
        .form-group textarea { height: 80px; resize: vertical; }
    </style>
</head>
<body>

<footer th:fragment="footer" style="margin-top: 25px; border-top: 1px solid #ccc; padding-top: 10px;">
    <p>&copy; 2026 CodeGym Product Management</p>
</footer>
</body>
</html>
